<!DOCTYPE html>
<html>
<head>
    <title>Training Iteration Progression</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            background: #f8f9fa;
        }
        h1 {
            color: #1a365d;
            border-bottom: 3px solid #2b6cb0;
            padding-bottom: 10px;
        }
        .organelle-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .organelle-card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.2s;
            border-left: 4px solid #2b6cb0;
        }
        .organelle-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }
        .organelle-name {
            font-size: 24px;
            font-weight: 600;
            color: #1a365d;
            margin-bottom: 15px;
            text-transform: uppercase;
        }
        .view-btn {
            display: inline-block;
            background: #2b6cb0;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .view-btn:hover {
            background: #2c5282;
        }
        .info {
            color: #4a5568;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>📈 Training Iteration Progression</h1>
    <p class="info">Track how F1 scores improve over training iterations. Each chart shows setups with multiple checkpoints.</p>
    
    <div class="organelle-grid">

        <div class="organelle-card">
            <div class="organelle-name">mito</div>
            <div class="info">
                <strong>8</strong> setups with multiple checkpoints
            </div>
            <a href="iteration_progression_mito.html" class="view-btn">View Training Curves →</a>
        </div>

        <div class="organelle-card">
            <div class="organelle-name">nuc</div>
            <div class="info">
                <strong>1</strong> setups with multiple checkpoints
            </div>
            <a href="iteration_progression_nuc.html" class="view-btn">View Training Curves →</a>
        </div>

    </div>
</body>
</html>
