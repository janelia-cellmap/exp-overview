<!DOCTYPE html>
<html>
<head>
    <title>Searchable Model Scores</title>
    <meta charset="utf-8">
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            max-width: 1600px;
            margin: 0 auto;
            padding: 40px 20px;
            background: #f8f9fa;
        }
        h1 {
            color: #1a365d;
            border-bottom: 3px solid #2b6cb0;
            padding-bottom: 10px;
            margin-bottom: 30px;
        }
        .controls {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .search-box {
            width: 100%;
            max-width: 400px;
            padding: 10px;
            font-size: 16px;
            border: 2px solid #cbd5e0;
            border-radius: 6px;
            margin-right: 10px;
        }
        .filter-group {
            display: inline-block;
            margin-right: 20px;
            margin-top: 10px;
        }
        .filter-group label {
            font-weight: 600;
            margin-right: 8px;
            color: #2d3748;
        }
        .filter-group select {
            padding: 8px 12px;
            border: 2px solid #cbd5e0;
            border-radius: 6px;
            font-size: 14px;
            background: white;
        }
        .stats {
            display: inline-block;
            margin-left: 20px;
            color: #4a5568;
            font-weight: 600;
        }
        .table-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            background: #2b6cb0;
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        th:hover {
            background: #2c5282;
        }
        th::after {
            content: ' ⇅';
            opacity: 0.5;
        }
        th.sort-asc::after {
            content: ' ↑';
            opacity: 1;
        }
        th.sort-desc::after {
            content: ' ↓';
            opacity: 1;
        }
        td {
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
        }
        tr:hover {
            background: #f7fafc;
        }
        tr.hidden {
            display: none;
        }
        .f1-high {
            background: #48bb78;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 600;
        }
        .f1-medium {
            background: #ecc94b;
            color: #1a202c;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 600;
        }
        .f1-low {
            background: #fc8181;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 600;
        }
        .export-btn {
            background: #2b6cb0;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            margin-left: 10px;
        }
        .export-btn:hover {
            background: #2c5282;
        }
    </style>
</head>
<body>
    <h1>🔍 Searchable Model Scores Table</h1>
    
    <div class="controls">
        <input type="text" id="searchBox" class="search-box" placeholder="Search by any field...">
        
        <div class="filter-group">
            <label>Organelle:</label>
            <select id="organelleFilter">
                <option value="">All</option>
            </select>
        </div>
        
        <div class="filter-group">
            <label>Dataset:</label>
            <select id="datasetFilter">
                <option value="">All</option>
            </select>
        </div>
        
        <div class="filter-group">
            <label>Experiment:</label>
            <select id="experimentFilter">
                <option value="">All</option>
            </select>
        </div>
        
        <button class="export-btn" onclick="exportToCSV()">📥 Export to CSV</button>
        
        <span class="stats" id="statsText">Showing <strong id="visibleCount">0</strong> of <strong id="totalCount">0</strong> rows</span>
    </div>
    
    <div class="table-container">
        <table id="scoresTable">
            <thead>
                <tr>
                    <th data-column="organelle">Organelle</th>
                    <th data-column="dataset">Dataset</th>
                    <th data-column="crop">Crop</th>

                    <th data-column="accuracy">Accuracy</th>
                    <th data-column="val_loss">Val Loss</th>
                </tr>
            </thead>
            <tbody id="tableBody">
            </tbody>
        </table>
    </div>

            return 'f1-low';

        function renderTable() {
            const tbody = document.getElementById('tableBody');

            const datasetFilter = document.getElementById('datasetFilter').value;
            const experimentFilter = document.getElementById('experimentFilter').value;
            
            const rows = document.querySelectorAll('#tableBody tr');
            
            rows.forEach(row => {
                const index = parseInt(row.dataset.index);
                const data = allData[index];
                
                // Check search text
                const matchesSearch = !searchText || 
                    Object.values(data).some(val => 
                        String(val).toLowerCase().includes(searchText)
                    );
                
                // Check filters
                const matchesOrganelle = !organelleFilter || data.organelle === organelleFilter;
                const matchesDataset = !datasetFilter || data.dataset === datasetFilter;
                const matchesExperiment = !experimentFilter || data.experiment === experimentFilter;
                
                if (matchesSearch && matchesOrganelle && matchesDataset && matchesExperiment) {
                    row.classList.remove('hidden');
                } else {
                    row.classList.add('hidden');
                }
            });
            
            updateStats();

        function sortTable(column) {
            const ascending = currentSort.column === column ? !currentSort.ascending : false;
            currentSort = { column, ascending };
            
            // Update header classes
            document.querySelectorAll('th').forEach(th => {
                th.classList.remove('sort-asc', 'sort-desc');
            });
            const header = document.querySelector(`th[data-column="${column}"]`);
            header.classList.add(ascending ? 'sort-asc' : 'sort-desc');
            
            // Sort data
            allData.sort((a, b) => {
                let aVal = a[column];
                let bVal = b[column];
                
                // Handle numeric values
                if (typeof aVal === 'number' && typeof bVal === 'number') {
                    return ascending ? aVal - bVal : bVal - aVal;
                }
                
                // Handle strings
                aVal = String(aVal).toLowerCase();
                bVal = String(bVal).toLowerCase();
                
                if (aVal < bVal) return ascending ? -1 : 1;
                if (aVal > bVal) return ascending ? 1 : -1;
                return 0;
            });
            
            renderTable();
            filterTable(); // Reapply filters
        }

            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'model_scores.csv';
            a.click();
            window.URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
